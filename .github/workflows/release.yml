name: Build Windows Release

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
    paths:
      - "version.json"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build requirements
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Validate release metadata
        shell: pwsh
        run: |
          $metadata = Get-Content "version.json" -Raw | ConvertFrom-Json
          $version = [string]$metadata.version
          $channel = [string]$metadata.channel
          $expectedTag = "v$version"
          $actualRef = "${{ github.ref }}"

          if ($channel -ne "stable") {
            throw "Public release workflow requires version.json channel 'stable'; got '$channel'."
          }
          if ($version.Contains("prebuild")) {
            throw "Public release version '$version' must not be a prebuild."
          }
          if ($actualRef.StartsWith("refs/tags/") -and "${{ github.ref_name }}" -ne $expectedTag) {
            throw "Release tag '${{ github.ref_name }}' does not match version.json '$expectedTag'."
          }

          $patchNotes = "PATCH_NOTES_v$version.md"
          if (-not (Test-Path $patchNotes -PathType Leaf)) {
            throw "Required patch notes file not found: $patchNotes"
          }

          "SOY_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SOY_TAG=$expectedTag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SOY_PATCH_NOTES=$patchNotes" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run tests
        shell: pwsh
        run: |
          python -m pytest -q

      - name: Run source audit
        shell: pwsh
        run: |
          python audit_source.py

      - name: Build executable
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build, dist -ErrorAction SilentlyContinue
          pyinstaller --noconfirm --clean "Stories Of Yggdrasil OSC.spec"

      - name: Assemble release archive
        shell: pwsh
        run: |
          $releaseBase = "release"
          $releaseRoot = Join-Path $releaseBase "Stories Of Yggdrasil OSC"

          Remove-Item -Recurse -Force $releaseBase -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $releaseRoot | Out-Null

          Copy-Item "dist/Stories Of Yggdrasil OSC/*" $releaseRoot -Recurse -Force
          Copy-Item README.md, QUICK_START.md, CHANGELOG.md, $env:SOY_PATCH_NOTES, version.json $releaseRoot -Force

          if (Test-Path "contracts") {
            Copy-Item "contracts" (Join-Path $releaseRoot "contracts") -Recurse -Force
          }

          $zip = "Stories_Of_Yggdrasil_OSC_Windows_${{ env.SOY_TAG }}.zip"
          Compress-Archive -Path $releaseRoot -DestinationPath $zip -Force

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content "$zip.sha256" -Encoding ascii

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.SOY_TAG }}
          name: Stories Of Yggdrasil OSC ${{ env.SOY_TAG }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ env.SOY_PATCH_NOTES }}
          prerelease: false
          make_latest: true
          files: |
            Stories_Of_Yggdrasil_OSC_Windows_${{ env.SOY_TAG }}.zip
            Stories_Of_Yggdrasil_OSC_Windows_${{ env.SOY_TAG }}.zip.sha256
