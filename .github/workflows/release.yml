name: Build Windows Release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish or update the GitHub Release after building
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install build requirements
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Verify repository
        shell: pwsh
        run: python tools/verify_repo.py --repo-root .

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Run source audit
        shell: pwsh
        run: python audit_source.py

      - name: Read release metadata
        id: meta
        shell: pwsh
        run: |
          $metadata = Get-Content "version.json" -Raw | ConvertFrom-Json
          $version = [string]$metadata.version
          $tag = if ($metadata.tag) { [string]$metadata.tag } else { "v$version" }
          $notes = if ($metadata.release_notes) { [string]$metadata.release_notes } else { "PATCH_NOTES_v$version.md" }
          $product = [string]$metadata.product
          $title = "$product v$version"
          $channel = [string]$metadata.channel
          $prerelease = if ($null -ne $metadata.prerelease) { [bool]$metadata.prerelease } else { $channel -ne "stable" }

          if (-not (Test-Path $notes -PathType Leaf)) {
            throw "Required release notes file not found: $notes"
          }

          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne $tag) {
            throw "Pushed tag '${{ github.ref_name }}' does not match version metadata '$tag'."
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "title=$title" >> $env:GITHUB_OUTPUT
          "notes=$notes" >> $env:GITHUB_OUTPUT
          "release_dir=release/$tag" >> $env:GITHUB_OUTPUT
          "prerelease=$($prerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Build release assets
        shell: pwsh
        run: python tools/build_release.py --repo-root .

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.tag }}-windows
          path: ${{ steps.meta.outputs.release_dir }}/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ github.ref_type == 'tag' || inputs.publish_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.meta.outputs.title }}
          body_path: ${{ steps.meta.outputs.notes }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            ${{ steps.meta.outputs.release_dir }}/*
